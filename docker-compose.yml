# AI RAG Platform - one-command stack
#   docker compose up --build
# Services: qdrant (vector DB), ollama (local models),
#           ollama-pull (model init), backend (FastAPI), frontend (React/nginx).
# Backend auto-falls back to an in-process memory vector store when QDRANT_HOST
# is empty, and to mock providers when *_PROVIDER=mock - so the stack is tunable.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot init container: pulls the embedding + LLM models, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "for m in nomic-embed-text qwen2.5:7b; do echo pulling $$m; ollama pull $$m || exit 1; done; echo models ready"
    restart: "no"

  backend:
    build: ./backend
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_BASE_URL: ${OPENAI_EMBED_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      API_KEY: ${API_KEY:-}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-5}
    depends_on:
      - qdrant
      - ollama-pull
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  qdrant_data:
  ollama_data:
